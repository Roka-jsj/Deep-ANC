# 시뮬레이션 학습 데이터 생성 설정 (on-the-fly 합성)

sample_rate: 48000
segment_seconds: 1.5

# 레퍼런스 모드 [교차검증 C2 — 두 모드의 지연 물리가 다르다]
#   digital : 소음원을 Jetson이 생성 → 출력버퍼 지연이 소음/상쇄 양경로에 공통 → 광대역 상쇄 가능
#   acoustic: 외부 소음을 레퍼런스 마이크로 수음 → P≈30ms 예측 필요 → 주기성/협대역 한정
reference_mode: digital

# 소음원 구성 비율 — 키 이름 = data/manifests/<키>.jsonl 태그 (manifest 없으면 합성원 폴백)
# quiet zone 목표: 소음뿐 아니라 대화(음성)·음악까지 소스 분포에 포함 (digital-ref 는
# 광대역 비정상 신호도 인과적 상쇄 가능 — docs/01 §3)
source_mix_ratio:
  synthetic: 0.25               # synthetic_signals.py: 톤+고조파, AM/FM 기계음, 협대역, 처프
  dns_fullband: 0.30            # DNS-Challenge noise_fullband (48kHz 실환경 소음)
  speech: 0.15                  # DNS-Challenge clean_fullband read_speech (48kHz 음성)
  music: 0.10                   # FMA-small (44.1kHz mp3 → 리샘플)
  demand: 0.08                  # DEMAND 48k (주방/세탁기/사무실/지하철 등 지속성 실환경)
  machine: 0.07                 # MIMII DG fan (16kHz ⚠ 저역 기계음 전용 — 덕트 제어대역 <1.6kHz 커버)
  esc50: 0.05                   # ESC-50 (비정상 환경음 — 강건화용 소량) [교차검증 L1]

# acoustic-ref 모드 전용 구성 [로드맵 A2] — reference_mode: acoustic 일 때 위 표를 대체.
# 주기성/공진(P≈30ms 에서 유일하게 예측 가능) 비중을 키우되, 예측 불가 광대역도 명시 포함
# (do-no-harm — "출력 0" 이 최적인 성분을 분포에 넣어야 증폭 안 하는 법을 배운다).
source_mix_ratio_acoustic:
  synthetic: 0.45               # 공진(210/350/489/629Hz) 가중 생성기 — 주기·협대역 중심
  machine: 0.15                 # 팬/회전기계 (준주기)
  dns_fullband: 0.20            # 예측 불가 광대역 — 무해화(0dB) 학습용
  demand: 0.10
  speech: 0.05                  # 비주기 — 무해화 학습용
  esc50: 0.05

noise_manifest_dir: data/manifests
rir_bank: data/rir_bank/duct_rirs_v1.npz

# 레벨/증강 랜덤화
level_dbfs: [-35, -10]
snr_mic_noise_db: [5, 30]       # 마이크 자기잡음 SNR
dc_hum_prob: 0.2

nonlinear:                      # 스피커/앰프 비선형 (Zhang & Wang 2021 프로토콜)
  # 물리 스케일 재보정 [로드맵 A1]: |y|≤0.2(리미터) 기준으로 η≥0.5 는 사실상 선형(no-op)이라
  # 증강이 무력화됨. η 를 신호 스케일에 상대화 — 10.0 은 선형 통과 센티널.
  sef_eta_choices: [0.05, 0.1, 0.2, 10.0]  # η·tanh(x/η): 강/중/약 포화 + 선형
  drive_range: [1.0, 4.0]
  hardclip_prob: 0.05

plant_perturbation:             # S(z) coherence 0.40 대응 도메인 랜덤화
  delay_jitter_range: [0, 512]  # duct.yaml secondary_path.delay_jitter_range 와 동일 의미
  gain_tilt_db_per_octave: [-2, 2]
  gain_db: [-3, 3]
  allpass_perturb: true

closed_loop:                    # Stage-2 폐루프 학습 전용 (chunk = hop × unroll_group_frames)
  feedback_delay_samples: [512, 1024]   # err 피드백 지연 랜덤화 [교차검증 H3]
  warmup_seconds: 0.25          # 손실 제외 구간 (플랜트 적용 후 절단)
  unroll_group_frames: 4        # 파이썬 루프 횟수 절감 [교차검증 H1]

# 분할 비율 참고(코드 내 고정): 노이즈풀 90/5/5(prepare_noise_pool.py),
# RIR 변형 90/5/5(synth_dataset.py), 실측 세션 80/10/10(make_recorded_manifest.py)
