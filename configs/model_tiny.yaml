# HybridANCNet-tiny — 현행 실시간 기본 모델 (≈1.2M params, 0.43 GMAC/s)
# 실측: ORT CPU P99 1.50ms — TensorRT 없이 실시간 게이트(P99<3ms) 통과.

name: hybrid_anc_tiny
hop: 128
win: 384
in_channels: 2
io_scale: 0.02                  # 입출력 정규화 스케일 (base 와 동일 유지)

encoder:
  channels: 128

tcn:
  repeats: 2
  dilations: [1, 2, 4, 8]
  hidden: 256
  kernel: 3

glstm:
  groups: 1
  hidden_per_group: 192
  insert_after_repeat: 2

attention:
  enabled: false                # TRT 리스크/연산 절감 — tiny는 MHSA 제거

limiter:
  limit: 0.2
