<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Deep ANC HybridANCNet 현재 사전학습 아키텍처</title>
  <desc id="desc">두 채널 입력을 인과 인코더, TCN, GLSTM, 선택적 MHSA, 인과 디코더로 처리하고 비선형 플랜트와 이차경로를 거쳐 잔여 소음 손실을 계산하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1c31"/>
    </linearGradient>
    <linearGradient id="modelGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12345a"/>
      <stop offset="1" stop-color="#172345"/>
    </linearGradient>
    <linearGradient id="plantGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#432817"/>
      <stop offset="1" stop-color="#302035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72d5ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb66e"/>
    </marker>
    <style>
      .title { font: 700 38px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #f3f8ff; }
      .subtitle { font: 400 18px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #9db2cb; }
      .section { font: 700 18px 'Noto Sans KR', 'Pretendard', sans-serif; letter-spacing: 1px; fill: #7bdcff; }
      .cardTitle { font: 700 24px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #ffffff; }
      .cardText { font: 500 16px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #c4d4e7; }
      .nodeTitle { font: 700 18px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #ffffff; text-anchor: middle; }
      .nodeText { font: 500 14px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #c7d8ea; text-anchor: middle; }
      .tinyText { font: 500 12px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #aac0d8; text-anchor: middle; }
      .trackLabel { font: 700 13px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #ffffff; text-anchor: middle; }
      .footer { font: 500 15px 'Noto Sans KR', 'Pretendard', sans-serif; fill: #afc2d8; }
      .panel { fill: #0b192a; stroke: #203a57; stroke-width: 1.5; }
      .node { fill: url(#modelGlow); stroke: #3a729f; stroke-width: 1.5; }
      .nodeAccent { fill: #143a4a; stroke: #50d0d2; stroke-width: 1.7; }
      .trackBase { fill: #14385a; stroke: #57b9ee; stroke-width: 1.2; }
      .trackTiny { fill: #24304d; stroke: #9d8cff; stroke-width: 1.2; }
      .plant { fill: url(#plantGlow); stroke: #b36c39; stroke-width: 1.5; }
      .loss { fill: #15372f; stroke: #4ec79d; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #72d5ff; stroke-width: 3; marker-end: url(#arrow); }
      .arrowThin { fill: none; stroke: #72d5ff; stroke-width: 1.7; marker-end: url(#arrow); }
      .arrowPlant { fill: none; stroke: #ffb66e; stroke-width: 3; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="1460" cy="60" r="190" fill="#0d4770" opacity="0.16"/>
  <circle cx="120" cy="970" r="210" fill="#43205c" opacity="0.12"/>

  <text x="54" y="58" class="title">HybridANCNet · 현재 사전학습 아키텍처</text>
  <text x="56" y="88" class="subtitle">48 kHz · 완전 인과 시간영역 모델 · 입력 2채널(ref/error) → 상쇄 스피커 출력 1채널</text>

  <g filter="url(#shadow)">
    <rect x="50" y="112" width="730" height="106" rx="16" class="node"/>
    <rect x="820" y="112" width="730" height="106" rx="16" class="node"/>
  </g>
  <rect x="67" y="129" width="82" height="30" rx="15" fill="#1682b8"/>
  <text x="108" y="150" class="trackLabel">GPU 0</text>
  <text x="168" y="153" class="cardTitle">BASE</text>
  <text x="67" y="181" class="cardText">5,994,512 params · 2.25 GMAC/s · C=256 · TCN 15개</text>
  <text x="67" y="204" class="cardText">GLSTM 2그룹×256 · causal MHSA 4헤드×64, KV 64프레임</text>

  <rect x="837" y="129" width="82" height="30" rx="15" fill="#725ad1"/>
  <text x="878" y="150" class="trackLabel">GPU 1</text>
  <text x="938" y="153" class="cardTitle">TINY</text>
  <text x="837" y="181" class="cardText">1,164,809 params · 0.43 GMAC/s · C=128 · TCN 8개</text>
  <text x="837" y="204" class="cardText">GLSTM 1그룹×192 · MHSA 비활성 · Jetson ORT 실시간 기본</text>

  <rect x="40" y="246" width="1520" height="370" rx="22" class="panel"/>
  <text x="66" y="280" class="section">01 · 인과 스트리밍 네트워크</text>

  <g filter="url(#shadow)">
    <rect x="68" y="326" width="166" height="166" rx="18" class="nodeAccent"/>
    <rect x="276" y="346" width="130" height="126" rx="16" class="node"/>
    <rect x="449" y="316" width="216" height="186" rx="18" class="node"/>
    <rect x="705" y="296" width="480" height="226" rx="20" class="node"/>
    <rect x="1226" y="316" width="188" height="186" rx="18" class="node"/>
    <rect x="1453" y="346" width="84" height="126" rx="16" class="nodeAccent"/>
  </g>

  <text x="151" y="365" class="nodeTitle">입력 x</text>
  <text x="151" y="395" class="nodeText">[B, 2, T]</text>
  <text x="151" y="423" class="nodeText">ch0 · x_ref</text>
  <text x="151" y="447" class="nodeText">ch1 · err_in</text>
  <text x="151" y="476" class="tinyText">T는 128의 배수</text>

  <text x="341" y="383" class="nodeTitle">정규화</text>
  <text x="341" y="413" class="nodeText">x ÷ 0.02</text>
  <text x="341" y="443" class="tinyText">입출력 스케일</text>

  <text x="557" y="352" class="nodeTitle">Causal Encoder</text>
  <text x="557" y="384" class="nodeText">좌측 history 256</text>
  <text x="557" y="410" class="nodeText">Conv1d k=384, s=128</text>
  <text x="557" y="436" class="nodeText">2→2C · GLU → C</text>
  <text x="557" y="462" class="nodeText">ChannelLN + 1×1</text>
  <text x="557" y="486" class="tinyText">미래 참조 0 · hop 2.67 ms</text>

  <text x="945" y="326" class="nodeTitle">Temporal Core</text>
  <text x="945" y="349" class="tinyText">TCN: 1×1 확장 → causal depthwise GLU → 1×1 축소 + residual</text>

  <text x="733" y="388" class="trackLabel">BASE</text>
  <rect x="768" y="365" width="67" height="40" rx="9" class="trackBase"/>
  <rect x="847" y="365" width="67" height="40" rx="9" class="trackBase"/>
  <rect x="926" y="365" width="80" height="40" rx="9" class="trackBase"/>
  <rect x="1018" y="365" width="67" height="40" rx="9" class="trackBase"/>
  <rect x="1097" y="365" width="69" height="40" rx="9" class="trackBase"/>
  <text x="801" y="390" class="trackLabel">TCN R1</text>
  <text x="880" y="390" class="trackLabel">TCN R2</text>
  <text x="966" y="390" class="trackLabel">GLSTM</text>
  <text x="1051" y="390" class="trackLabel">TCN R3</text>
  <text x="1131" y="390" class="trackLabel">MHSA</text>
  <path d="M835 385 H845 M914 385 H924 M1006 385 H1016 M1085 385 H1095" class="arrowThin"/>

  <text x="733" y="463" class="trackLabel">TINY</text>
  <rect x="783" y="440" width="83" height="40" rx="9" class="trackTiny"/>
  <rect x="885" y="440" width="83" height="40" rx="9" class="trackTiny"/>
  <rect x="987" y="440" width="96" height="40" rx="9" class="trackTiny"/>
  <text x="825" y="465" class="trackLabel">TCN R1</text>
  <text x="927" y="465" class="trackLabel">TCN R2</text>
  <text x="1035" y="465" class="trackLabel">GLSTM</text>
  <path d="M866 460 H883 M968 460 H985" class="arrowThin"/>
  <text x="1122" y="466" class="tinyText">attention 없음</text>

  <text x="1320" y="352" class="nodeTitle">Head + Decoder</text>
  <text x="1320" y="384" class="nodeText">1×1 C→2C + PReLU</text>
  <text x="1320" y="414" class="nodeText">ConvTranspose1d</text>
  <text x="1320" y="440" class="nodeText">k=384, s=128</text>
  <text x="1320" y="466" class="nodeText">causal OLA</text>
  <text x="1320" y="489" class="tinyText">decoder tail 256</text>

  <text x="1495" y="382" class="nodeTitle">y</text>
  <text x="1495" y="410" class="nodeText">[B,1,T]</text>
  <text x="1495" y="438" class="tinyText">×0.02</text>
  <text x="1495" y="458" class="tinyText">0.2·tanh</text>

  <path d="M234 409 H274" class="arrow"/>
  <path d="M406 409 H447" class="arrow"/>
  <path d="M665 409 H703" class="arrow"/>
  <path d="M1185 409 H1224" class="arrow"/>
  <path d="M1414 409 H1451" class="arrow"/>

  <text x="70" y="555" class="footer">명시적 스트리밍 상태 · encoder history / TCN dilation history / GLSTM h,c / base KV cache / decoder tail</text>
  <rect x="1285" y="535" width="247" height="42" rx="21" fill="#102b3b" stroke="#42c8cc"/>
  <text x="1408" y="561" class="trackLabel">알고리즘 지연 0 · block 256</text>

  <rect x="40" y="638" width="1520" height="334" rx="22" class="panel"/>
  <text x="66" y="674" class="section">02 · 현재 OPEN-LOOP SURROGATE 사전학습 경로</text>

  <g filter="url(#shadow)">
    <rect x="70" y="748" width="138" height="92" rx="16" class="nodeAccent"/>
    <rect x="250" y="748" width="204" height="92" rx="16" class="plant"/>
    <rect x="528" y="688" width="150" height="82" rx="16" class="node"/>
    <rect x="724" y="688" width="150" height="82" rx="16" class="plant"/>
    <rect x="920" y="688" width="200" height="82" rx="16" class="plant"/>
    <circle cx="1169" cy="795" r="34" fill="#203d4b" stroke="#83e2dc" stroke-width="2"/>
    <rect x="1227" y="724" width="296" height="142" rx="18" class="loss"/>
  </g>

  <text x="139" y="783" class="nodeTitle">원 소리 n(t)</text>
  <text x="139" y="811" class="nodeText">공개 6종 + 합성</text>

  <text x="352" y="780" class="nodeTitle">1차경로</text>
  <text x="352" y="808" class="nodeText">P(z) · n · D=1489</text>
  <text x="352" y="830" class="tinyText">현재 P=S surrogate · 실측 전</text>

  <text x="603" y="720" class="nodeTitle">모델 출력 y</text>
  <text x="603" y="748" class="nodeText">ref = n(t+109)</text>

  <text x="799" y="720" class="nodeTitle">G_nl(y)</text>
  <text x="799" y="746" class="nodeText">Stage-1: linear 고정</text>

  <text x="1020" y="716" class="nodeTitle">2차경로 S(z)</text>
  <text x="1020" y="742" class="nodeText">FIR 2048 · delay 1342</text>
  <text x="1020" y="762" class="tinyText">+ thread handoff 256 = 1598</text>

  <text x="1169" y="804" class="cardTitle" text-anchor="middle">+</text>
  <text x="1169" y="850" class="tinyText">e = d + S·G_nl(y)</text>

  <text x="1375" y="756" class="nodeTitle">FP32 Loss</text>
  <text x="1375" y="788" class="nodeText">trusted NMSE · 150–600 Hz</text>
  <text x="1375" y="814" class="nodeText">MR-STFT + power + clip</text>
  <text x="1375" y="842" class="tinyText">warm-up 절단은 플랜트 적용 후</text>

  <path d="M208 794 H248" class="arrowPlant"/>
  <path d="M454 794 H1133" class="arrowPlant"/>
  <path d="M678 729 H722" class="arrowPlant"/>
  <path d="M874 729 H918" class="arrowPlant"/>
  <path d="M1120 729 C1150 729 1169 746 1169 759" class="arrowPlant"/>
  <path d="M1203 795 H1225" class="arrow"/>

  <rect x="70" y="890" width="1453" height="52" rx="13" fill="#101f32" stroke="#29435f"/>
  <text x="96" y="922" class="footer">불변식 · +109는 playback FIFO로 실제 확보 · 극성 e=d+S·y · loss FP32 · segment 256 배수 · offline=streaming 등가</text>

  <text x="52" y="1012" class="footer">Deep ANC · configs/model_base.yaml · configs/model_tiny.yaml · src/deep_anc/models/hybrid_anc.py</text>
  <text x="1548" y="1012" class="footer" text-anchor="end">2026-08-03</text>
</svg>
