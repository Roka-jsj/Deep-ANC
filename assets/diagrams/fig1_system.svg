<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
  <rect width="1080" height="470" fill="#ffffff"/>
  <text x="40.0" y="38.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#16202c" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">Figure 1.  ANC 신호 흐름 — 학습과 실기가 같은 방정식을 쓴다</text>
  <text x="40.0" y="60.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">모델은 상쇄 파형 y(t) 를 직접 회귀한다. 학습에서는 실측 S(z) 를 미분 가능한 플랜트로 통과시켜 e(t) 를 최소화한다.</text>
  <rect x="40.0" y="94.0" width="150.0" height="52.0" rx="8.0" fill="#f4f6f8" fill-opacity="1.0" stroke="#16202c" stroke-width="1.6"/>
