  <text x="1015.0" y="300.0" font-family="'Noto Sans Mono CJK KR', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#8a6d1f" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">S·y(t)</text>
