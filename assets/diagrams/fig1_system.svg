  <text x="335.0" y="295.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#16202c" fill-opacity="1.0" text-anchor="middle" dominant-baseline="middle">digital reference</text>
  <text x="335.0" y="312.0" font-family="'Noto Sans Mono CJK KR', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="middle" dominant-baseline="middle">x_ref(t) = n(t + 109)</text>
