  <rect x="830.0" y="400.0" width="210.0" height="44.0" rx="8.0" fill="#fdf3f1" fill-opacity="1.0" stroke="#a8322d" stroke-width="1.6"/>
  <text x="935.0" y="422.0" font-family="'Noto Sans Mono CJK KR', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#a8322d" fill-opacity="1.0" text-anchor="middle" dominant-baseline="middle">e(t) = d(t) + S·y(t)</text>
  <text x="935.0" y="456.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="middle" dominant-baseline="middle">에러 마이크 — 손실 대상</text>
  <text x="40.0" y="400.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#16202c" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">극성 규약</text>
  <text x="40.0" y="420.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">측정 FIR 에 극성이 이미 들어 있다.</text>
  <text x="40.0" y="436.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">어디에서도 추가 부호 반전을 하지 않는다.</text>
  <text x="300.0" y="400.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#16202c" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">선행량</text>
  <text x="300.0" y="420.0" font-family="'Noto Sans Mono CJK KR', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">lead = S 1342 + handoff 256 − P 1489 = 109</text>
  <text x="300.0" y="436.0" font-family="'Noto Sans Mono CJK KR', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">상쇄음이 소음보다 늦게 도착하는 만큼 미리 본다.</text>
