  <text x="40.0" y="380.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">이 h, c 가 스트리밍 상태의 실체다 — ONNX 에서 그래프 밖으로 드러나야 오프라인/스트리밍 등가를 검증할 수 있다 (Figure 6).</text>
