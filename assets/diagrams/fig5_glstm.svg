<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
  <rect width="1080" height="430" fill="#ffffff"/>
  <text x="40.0" y="38.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#16202c" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">Figure 5.  Grouped LSTM — 순환 비용을 G 배 줄이고 셔플로 다시 섞는다</text>
  <text x="40.0" y="60.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="normal" fill="#7b8794" fill-opacity="1.0" text-anchor="start" dominant-baseline="middle">GCRN 의 그룹 전략. 채널을 G 그룹으로 나눠 그룹마다 작은 LSTM 을 돌리면 파라미터가 1/G 로 준다. 그대로 두면 그룹이 서로 못 보므로 셔플로 섞는다. (그림은 G = 2 예시)</text>
  <rect x="70.0" y="130.0" width="120.0" height="120.0" rx="8.0" fill="#f4f6f8" fill-opacity="1.0" stroke="#16202c" stroke-width="1.6"/>
