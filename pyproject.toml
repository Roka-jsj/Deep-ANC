[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-anc"
version = "0.1.0"
description = "Deep learning based Active Noise Control for a rectangular acrylic duct (Jetson AGX Orin + Elice Cloud A100)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Deep_ANC Capstone Team" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
